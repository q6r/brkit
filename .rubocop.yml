AllCops:
  TargetRubyVersion: 3.1
  NewCops: enable
  SuggestExtensions: false
  Exclude:
    - "vendor/**/*"
    - "node_modules/**/*"
    - "tmp/**/*"
    - "public/**/*"

Layout/LineLength:
  Max: 130

# Public API classes and modules carry YARD comments; the test classes do not need them.
Style/Documentation:
  Exclude:
    - "test/**/*"

Style/StringLiterals:
  EnforcedStyle: double_quotes

Style/StringLiteralsInInterpolation:
  EnforcedStyle: single_quotes

Style/SymbolArray:
  EnforcedStyle: brackets

Style/WordArray:
  EnforcedStyle: percent
  MinSize: 3

Style/TrailingCommaInArguments:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInArrayLiteral:
  EnforcedStyleForMultiline: no_comma

Style/TrailingCommaInHashLiteral:
  EnforcedStyleForMultiline: no_comma

Style/FormatStringToken:
  Enabled: false

Style/NumericLiterals:
  Enabled: false

# "uf" (the Brazilian state code) and "id" read better than longer names.
Naming/MethodParameterName:
  MinNameLength: 2

# Test names such as test_status_404 keep the number apart on purpose.
Naming/VariableNumber:
  Exclude:
    - "test/**/*"

# Param#min / #max and Tlv#length are the natural names of those fields; the Enumerable methods of the same
# name are never called on these structs.
Lint/StructNewOverride:
  Enabled: false

Naming/PredicateMethod:
  Enabled: false

Naming/PredicatePrefix:
  Enabled: false

Lint/MissingSuper:
  Enabled: false

# Validators and lookup tables read better with a little more room than the defaults allow;
# the test files are exempt from the size metrics.
Metrics/AbcSize:
  Max: 40
  Exclude:
    - "test/**/*"

Metrics/CyclomaticComplexity:
  Max: 15

Metrics/PerceivedComplexity:
  Max: 15

Metrics/MethodLength:
  Max: 30
  Exclude:
    - "test/**/*"

Metrics/ClassLength:
  Max: 450
  CountAsOne: ["array", "hash", "heredoc"]
  Exclude:
    - "test/**/*"

Metrics/ModuleLength:
  Max: 300

Metrics/ParameterLists:
  Max: 10
  CountKeywordArgs: false

Metrics/BlockLength:
  Exclude:
    - "test/**/*"
    - "*.gemspec"
    - "Rakefile"
